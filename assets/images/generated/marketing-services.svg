  <g fill="#c8a45d"><rect class="bar" x="230" y="700" width="70" height="160"/><rect class="bar" x="340" y="620" width="70" height="240"/><rect class="bar" x="450" y="540" width="70" height="320"/><rect class="bar" x="560" y="450" width="70" height="410"/></g>
